[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-pkpd"
version = "0.2.0"
description = "In silico drug testing: register drugs by chemical structure, dock them into protein structures in 3D, and simulate their pharmacokinetics (PK) and pharmacodynamics (PD)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
chem = ["rdkit>=2023.3"]
plot = ["matplotlib>=3.6"]
# Docking also needs the AutoDock Vina and Open Babel programs, which are not
# Python packages - see requirements.txt.
dock = ["rdkit>=2023.3", "meeko>=0.5", "gemmi>=0.6"]
all = ["rdkit>=2023.3", "matplotlib>=3.6", "meeko>=0.5", "gemmi>=0.6"]
test = ["pytest>=7.0"]

[project.scripts]
alpha = "alpha.cli:main"

[tool.setuptools]
packages = ["alpha"]

[tool.setuptools.package-data]
alpha = ["data/*.json"]

[tool.pytest.ini_options]
markers = ["slow: runs an actual docking calculation (needs AutoDock Vina)"]
